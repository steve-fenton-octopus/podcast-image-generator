<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pull Quote Generator</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>Pull Quote Generator</h1>
                <p>Create beautiful pull quotes.</p>
            </div>
            
            <form id="generator-form">
                <div class="form-group">
                    <label for="quoteText">Quote Text</label>
                    <textarea id="quoteText" rows="4" placeholder="e.g. This is a very insightful quote about technology.">This is a very insightful quote about technology.</textarea>
                </div>
                
                <div class="form-group">
                    <label for="citationText">Citation</label>
                    <input type="text" id="citationText" value="Jane Doe" placeholder="e.g. Jane Doe">
                </div>
                
                <div class="form-group row">
                    <div class="col">
                        <label for="themeColor">Theme Color</label>
                        <input type="color" id="themeColor" value="#3b82f6">
                    </div>
                </div>

                <div class="actions">
                    <button type="button" id="generate-btn" class="btn btn-primary">Refresh Preview</button>
                    <button type="button" id="download-btn" class="btn btn-success">Download Quote (2560x1440)</button>
                </div>
            </form>
        </aside>
        
        <main class="preview-area">
            <div class="canvas-wrapper">
                <canvas id="thumbnail-canvas" width="2560" height="1440"></canvas>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
