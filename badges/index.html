<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Badge Generator</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>Digital Badge Generator</h1>
                <p>Create flat, Credly-style credential badges.</p>
            </div>

            <form id="generator-form">
                <div class="form-group">
                    <label for="badgeName">Badge Name</label>
                    <input type="text" id="badgeName" value="Research Hero" placeholder="e.g. Research Hero">
                </div>

                <div class="form-group">
                    <label for="badgeIcon">Icon (Unicode / Emoji)</label>
                    <input type="text" id="badgeIcon" value="🔬" placeholder="e.g. 🔬 or ★">
                    <span class="hint">Single character or emoji shown above the ribbon.</span>
                </div>

                <div class="form-group">
                    <label for="badgeYear">Year</label>
                    <input type="number" id="badgeYear" value="2026" min="1900" max="2100">
                </div>

                <div class="form-group">
                    <label for="badgeSides">Number of Sides</label>
                    <select id="badgeSides">
                        <option value="1">1 — Circle</option>
                        <option value="6" selected>6 — Hexagon</option>
                        <option value="8">8 — Octagon</option>
                    </select>
                    <span class="hint">1 draws a circle; 3 or more draws a regular polygon.</span>
                </div>

                <div class="form-group">
                    <label>Badge Color</label>
                    <div class="metal-options" role="radiogroup" aria-label="Badge color">
                        <label class="metal-option">
                            <input type="radio" name="badgeMetal" value="gold" checked>
                            <span class="metal-swatch metal-gold"></span>
                            Gold
                        </label>
                        <label class="metal-option">
                            <input type="radio" name="badgeMetal" value="silver">
                            <span class="metal-swatch metal-silver"></span>
                            Silver
                        </label>
                        <label class="metal-option">
                            <input type="radio" name="badgeMetal" value="bronze">
                            <span class="metal-swatch metal-bronze"></span>
                            Bronze
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="highlightColor">Highlight Color</label>
                    <input type="color" id="highlightColor" value="#2563eb">
                </div>

                <div class="actions">
                    <button type="button" id="generate-btn" class="btn btn-primary">Refresh Preview</button>
                    <button type="button" id="download-btn" class="btn btn-success">Download Badge (1024×1024)</button>
                </div>
            </form>
        </aside>

        <main class="preview-area">
            <div class="canvas-wrapper canvas-wrapper-square">
                <canvas id="badge-canvas" width="1024" height="1024"></canvas>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
